name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pytest pytest-mock
      - name: 运行测试
        run: bash scripts/run-test.sh
      - name: 核对文档
        run: bash scripts/check-docs.sh
