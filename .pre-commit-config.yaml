repos:
  - repo: local
    hooks:
      - id: pytest
        name: 运行测试
        entry: bash scripts/run-test.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: check-docs
        name: 核对文档
        entry: bash scripts/check-docs.sh
        language: system
        pass_filenames: false
        always_run: true
